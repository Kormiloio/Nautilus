# Netlify configuration for Nautilus
#
# Added 2026-09-02, when the repo moved from mcamaj to the Kormiloio org.
# Until now these settings existed ONLY in the Netlify UI, which meant they
# were invisible in code review and easy to lose in exactly this kind of move.
# Config in the repo wins: it survives transfers, relinks and site rebuilds.
#
# Site: kormilo-nautilus.netlify.app
# Proxied by kormiloio.github.io at kormilo.io/fleet/nautilus

[build]
  # vite.config.js sets root='src' and build.outDir='../web',
  # so the built site lands in web/ at the repo root.
  command = "npm run verify:release && npm run build"
  publish = "web"

[build.environment]
  # Local dev runs Node 26, which Netlify's build image doesn't offer.
  # 22 is the newest LTS Netlify supports and satisfies Vite 6 + Vitest 4.
  # Verified 2026-09-02: `npm run build` and all 75 tests pass.
  NODE_VERSION = "22"

# web/_headers already sets CORS for /assets/*. Kept there rather than
# duplicated here, since that file ships with the build output.

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://kormilo-nautilus.netlify.app; style-src 'self' 'unsafe-inline' https://kormilo-nautilus.netlify.app; img-src 'self' data: https:; font-src 'self' data: https://kormilo-nautilus.netlify.app; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://accounts.google.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), geolocation=(), payment=(), usb=()"
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

# Vite emits content-hashed filenames under /assets, so they're immutable.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
