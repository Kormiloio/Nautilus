# Netlify configuration for Nautilus
#
# Added 2026-09-02, when the repo moved from mcamaj to the Kormiloio org.
# Until now these settings existed ONLY in the Netlify UI, which meant they
# were invisible in code review and easy to lose in exactly this kind of move.
# Config in the repo wins: it survives transfers, relinks and site rebuilds.
#
# Site: kormilo-nautilus.netlify.app
# Proxied by kormiloio.github.io at kormilo.io/fleet/nautilus

[build]
  # vite.config.js sets root='src' and build.outDir='../web',
  # so the built site lands in web/ at the repo root.
  command = "npm run build"
  publish = "web"

[build.environment]
  # Not pinned anywhere else in the repo. Vite 6 requires Node 18+;
  # 20 is the current LTS. Change if your local version differs.
  NODE_VERSION = "20"

# web/_headers already sets CORS for /assets/*. Kept there rather than
# duplicated here, since that file ships with the build output.

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

# Vite emits content-hashed filenames under /assets, so they're immutable.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
