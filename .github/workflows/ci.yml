name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci
      - name: Run lint (placeholder)
        run: echo "No lint configured"
      - name: Run tests with coverage
        run: npm test -- --coverage
      - name: Build project
        run: npm run build
      - name: Accessibility audit
        run: |
          npx -y a11y-debugging@latest run --output a11y-report.json || true
      - name: Upload coverage badge
        run: |
          # Example: generate badge via shields.io (placeholder)
          echo "Coverage badge update placeholder"
