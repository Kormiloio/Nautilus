name: Scheduled Build Artifact Pruning

# Run on the default branch (main) every Sunday at 02:00 UTC
on:
  schedule:
    - cron: '0 2 * * 0'
  workflow_dispatch:

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Build project (ensures web/ exists)
        run: npm run build

      - name: Run prune script
        run: node scripts/prune-build-artifacts.mjs

      - name: Commit and push any removals
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          if git status --porcelain | grep .; then
            git add -u web/assets
            git commit -m "chore: scheduled prune of stale build artifacts"
            git push origin HEAD:${{ github.ref_name }}
          else
            echo "No stale artifacts to prune"
          fi
